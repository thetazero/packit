name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: npm ci
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build
